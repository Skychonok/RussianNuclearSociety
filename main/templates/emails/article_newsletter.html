<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>{{ article.title }}</title>
</head>

<body style="margin:0;padding:0;background:#f5f5f5;font-family:Arial, sans-serif;">

  <div style="max-width:600px;margin:0 auto;background:#ffffff;padding:24px;">

    <h1 style="color:#111827;font-size:22px;margin-bottom:8px;">
      {{ article.title }}
    </h1>

    <p style="color:#6b7280;font-size:13px;margin-top:0;">
      {{ article.created_at|date:"d.m.Y H:i" }}
    </p>

    <hr style="border:none;border-top:1px solid #e5e7eb;margin:20px 0;">

    <div style="color:#111827;font-size:15px;line-height:1.6;">
      {{ article.content|striptags|truncatechars:800 }}
    </div>

    <div style="margin:30px 0;text-align:center;">
      <a href="{{ article_url }}"
         style="
            background:#2563eb;
            color:#ffffff;
            padding:12px 20px;
            text-decoration:none;
            border-radius:6px;
            display:inline-block;
            font-weight:bold;
         ">
        Читать полностью
      </a>
    </div>

    <p style="font-size:12px;color:#9ca3af;text-align:center;">
      Вы получили это письмо, потому что подписаны на рассылку новостей.
    </p>

  </div>

</body>
</html>
